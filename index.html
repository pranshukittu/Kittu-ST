<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Welcome to Hawkins - Created by Kittu</title>

  <!-- React (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>


  <style>
    :root{
      --bg:#050406;
      --card:#0f1114;
      --accent:#ff2d44;
      --muted:#9aa0a6;
      --text:#eaf4ff;
      --good:#ffd86b;
      --perfect:#9b59b6;
      --love:#29b06f;
      --hate:#e74c3c;
      --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    html,body,#root{height:100%}
    body{
      margin:0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(ellipse at 10% 10%, rgba(255,45,68,0.04), transparent 10%),
        linear-gradient(180deg,#050406 0%, #07060a 60%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      padding:18px;
    }

    /* Animated headline / horror style */
    .topbar{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:18px;
    }
    .logo-badge{
      background:linear-gradient(90deg,var(--accent),#ff7b9a);
      color:white;
      padding:8px 12px;
      border-radius:8px;
      font-weight:800;
      font-family: "Courier New", monospace;
      letter-spacing:1px;
      box-shadow:0 10px 40px rgba(255,45,68,0.08);
    }
    h1.title{
      margin:0;
      font-size:20px;
      font-weight:800;
      position:relative;
      letter-spacing:0.6px;
      line-height:1;
      display:inline-block;
      padding-bottom:6px;
    }
    /* red neon underline */
    h1.title:after{
      content:"";
      position:absolute; left:0; right:0; bottom:-6px; height:6px;
      background: linear-gradient(90deg,var(--accent),#ff7b9a);
      filter: blur(8px);
      opacity:0.6;
      border-radius:6px;
    }
    /* blinking "Created by Kittu" */
    .sub {
      font-size:13px;
      color:var(--muted);
      margin-left:8px;
      animation: pulse 2.6s infinite;
    }
    @keyframes pulse{
      0%{opacity:1; transform: translateY(0)}
      50%{opacity:0.55; transform: translateY(-4px)}
      100%{opacity:1; transform: translateY(0)}
    }

    /* layout */
    .toolbar{
      margin-left:auto;
      display:flex;
      gap:8px;
      align-items:center;
    }
    .btn{
      background:var(--glass);
      border:1px solid rgba(255,255,255,0.04);
      padding:8px 10px;
      border-radius:8px;
      color:var(--text);
      cursor:pointer;
      font-weight:600;
    }

    .container{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:20px;
      align-items:start;
    }

    /* grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap:14px;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      border-radius:12px;
      padding:12px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.03);
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:340px;
    }

    .photo{
      height:230px;
      border-radius:8px;
      overflow:hidden;
      background:linear-gradient(90deg, rgba(255,45,68,0.06), transparent);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      text-align:center;
      position:relative;
    }
    .photo img{ width:100%; height:100%; object-fit:cover; display:block; }

    .meta{ display:flex; justify-content:space-between; align-items:flex-start; }
    .who{ font-weight:800; font-size:15px; }
    .by{ font-size:12px; color:var(--muted); }

    .tag{
      padding:6px 10px;
      border-radius:999px;
      font-weight:700;
      font-size:12px;
      color:var(--text);
      background:var(--good);
    }
    .tag.perfect{ background:var(--perfect); color:white; }
    .tag.love{ background:var(--love); color:white; }
    .tag.good{ background:var(--good); color:#222; }
    .tag.hate{ background:var(--hate); color:white; }

    .stars{ display:flex; gap:6px; align-items:center; }
    .star{ width:22px; height:22px; cursor:pointer; opacity:0.95; transition:transform .12s; }
    .star.off{ filter: grayscale(80%); opacity:0.45; }
    .star:hover{ transform:scale(1.08) }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:12px;
      border:1px solid rgba(255,255,255,0.03);
    }
    .panel h3{ margin:0 0 8px 0; font-size:15px }

    .leaderboard-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,0.03) }
    .small{ font-size:13px; color:var(--muted) }

    /* modal style */
    .modal-backdrop{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)); z-index:60;
    }
    .modal{
      width:420px; background:linear-gradient(180deg,#0b0b0d,#070709); border-radius:10px; padding:18px; box-shadow:0 30px 80px rgba(0,0,0,0.7);
    }
    .input{
      width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.04); background:transparent; color:var(--text);
    }

    footer{ margin-top:16px; color:var(--muted); font-size:13px; }

    @media (max-width:980px){
      .container{ grid-template-columns: 1fr; }
    }

  </style>
</head>
<body>
  <div id="root"></div>

  
  <!-- App code (React) -->
   <script>
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBaXuOEHL0Ps947IhPUZWFLC14z7fERJiQ",
    authDomain: "stranger-things-23783.firebaseapp.com",
    projectId: "stranger-things-23783",
    storageBucket: "stranger-things-23783.firebasestorage.app",
    messagingSenderId: "16963374906",
    appId: "1:16963374906:web:a7bf3bb36124d9ab814a03"

  <script type="text/babel">

  /*************************************************************************
   * Single-file React app
   * Storage: localStorage per-browser
   * - Users: saved under key "sfans_users" (object of usernames)
   * - Votes: saved under key "sfans_votes" (object: { username: { <img>: {stars,label} } })
   * Leaderboard: aggregated from sfans_votes across all usernames
   *
   * NOTE: GitHub cannot be used as a client-side database. If you want cloud
   * persistence across devices use Firebase (see commented guidance at bottom).
   *************************************************************************/

  const { useState, useEffect } = React;

  /* --- filenames to use (images must be placed in /images/ next to this file) --- */
  const IMAGE_FOLDER = 'images/';  // keep exactly this folder name
  const CHAR_FILES = [
    { name: "Joyce Byers", actor: "Winona Ryder", img:"joyce.jpg" },
    { name: "Jim Hopper", actor: "David Harbour", img:"hopper.jpg" },
    { name: "Mike Wheeler", actor: "Finn Wolfhard", img:"mike.jpg" },
    { name: "Eleven / Jane Hopper", actor: "Millie Bobby Brown", img:"el.jpg" },
    { name: "Dustin Henderson", actor: "Gaten Matarazzo", img:"dustin.jpg" },
    { name: "Lucas Sinclair", actor: "Caleb McLaughlin", img:"lucas.jpg" },
    { name: "Nancy Wheeler", actor: "Natalia Dyer", img:"nancy.jpg" },
    { name: "Jonathan Byers", actor: "Charlie Heaton", img:"jonathan.jpg" },
    { name: "Karen Wheeler", actor: "Cara Buono", img:"karen.jpg" },
    { name: "Will Byers", actor: "Noah Schnapp", img:"will.jpg" },
    { name: "Steve Harrington", actor: "Joe Keery", img:"steve.jpg" },
    { name: "Max Mayfield", actor: "Sadie Sink", img:"max.jpg" },
    { name: "Erica Sinclair", actor: "Priah Ferguson", img:"erica.jpg" },
    { name: "Robin Buckley", actor: "Maya Hawke", img:"robin.jpg" },
    { name: "Murray Bauman", actor: "Brett Gelman", img:"murray.jpg" },
    { name: "Vecna / One / Henry Creel", actor: "Jamie Campbell Bower", img:"vecnahenry.jpg" },
    { name: "Dr. Kay", actor: "Linda Hamilton", img:"drkay.jpg" },
    { name: "Derek Turnbow", actor: "Jake Connelly", img:"derek.jpg" },
    { name: "Tina Turnbow", actor: "caroline-elle-abrahim.jpg", img:"tina.jpg" },
    { name: "Holly Weeler", actor: "Nell Fisher", img:"holly.jpg" }
  ];

  /* localStorage keys */
  const USERS_KEY = 'sfans_users_v1'; // saved user list (optional)
  const VOTES_KEY = 'sfans_votes_v1'; // { username: { imgPath: { stars, label } } }
  const CUR_USER_KEY = 'sfans_current_user_v1';

  /* helpers */
  function starsToLabel(n){
    if(n >= 5) return 'Perfect';
    if(n === 4) return 'Love them';
    if(n === 3) return 'Good';
    return 'hate them';
  }

  function loadJSON(key, fallback){
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch(e){ return fallback; }
  }
  function saveJSON(key, obj){ localStorage.setItem(key, JSON.stringify(obj)); }

  /* App */
  function App(){
    const [user, setUser] = useState(() => loadJSON(CUR_USER_KEY, null));
    const [users, setUsers] = useState(() => loadJSON(USERS_KEY, {}));
    const [votes, setVotes] = useState(() => loadJSON(VOTES_KEY, {}));
    const [showLogin, setShowLogin] = useState(!user);
    const [filterQuery, setFilterQuery] = useState('');

    useEffect(() => saveJSON(USERS_KEY, users), [users]);
    useEffect(() => saveJSON(VOTES_KEY, votes), [votes]);
    useEffect(() => saveJSON(CUR_USER_KEY, user), [user]);

    // aggregated leaderboard computed from votes object
    function computeLeaderboard(){
      const agg = {}; // { imgPath: { count, starsTotal } }
      Object.entries(votes).forEach(([uname, userVotes]) => {
        Object.entries(userVotes).forEach(([img, v]) => {
          agg[img] = agg[img] || { count:0, starsTotal:0 };
          agg[img].count += 1;
          agg[img].starsTotal += (v.stars || 0);
        });
      });
      // map to array with name
      return CHAR_FILES.map(c => {
        const a = agg[c.img] || { count:0, starsTotal:0 };
        return { img:c.img, name:c.name, actor:c.actor, votes:a.count, avg: a.count ? +(a.starsTotal / a.count).toFixed(2) : 0 };
      }).sort((a,b) => b.votes - a.votes);
    }

    function handleLogin(name){
      const trimmed = (name || '').trim();
      if(!trimmed){ alert('Enter a name to continue'); return; }
      // create user record if not exists
      setUsers(prev => ({ ...prev, [trimmed]: { name: trimmed, created: Date.now() } }));
      setUser(trimmed);
      setShowLogin(false);
    }

    function handleLogout(){
      setUser(null);
      setShowLogin(true);
    }

    function setVoteForCurrent(imgPath, stars){
      if(!user){
        alert('Please sign in with a name first.');
        setShowLogin(true);
        return;
      }
      const label = starsToLabel(stars);
      setVotes(prev => {
        const copy = { ...prev };
        copy[user] = copy[user] || {};
        copy[user][imgPath] = { stars, label, ts: Date.now() };
        return copy;
      });
    }

    function clearAllLocal(){
      if(!confirm('Clear ALL saved local users and votes? This cannot be undone.')) return;
      setUsers({});
      setVotes({});
      setUser(null);
      localStorage.removeItem(USERS_KEY);
      localStorage.removeItem(VOTES_KEY);
      localStorage.removeItem(CUR_USER_KEY);
      setShowLogin(true);
    }

    const leaderboard = computeLeaderboard();

    // filtered characters
    const visibleChars = CHAR_FILES.filter(c => {
      if(!filterQuery) return true;
      const q = filterQuery.toLowerCase();
      return c.name.toLowerCase().includes(q) || c.actor.toLowerCase().includes(q);
    });

    return (
      <div>
        <div className="topbar">
          <div className="logo-badge">HAWKINS</div>
          <div>
            <h1 className="title">Welcome to Hawkins - Created by Kittu</h1>
            <div className="sub">A spooky place for fans — vote your favourites</div>
          </div>

          <div className="toolbar">
            <input className="input" placeholder="Search characters..." value={filterQuery} onChange={e=>setFilterQuery(e.target.value)} style={{width:220, marginRight:6}} />
  {user ? (
  <div style={{display:'flex', gap:8, alignItems:'center'}}>
    <div style={{ fontSize: 13, color: 'var(--muted)' }}>
          Signed in as <strong style={{ color: 'var(--text)' }}>{user}</strong>
        </div>
  <button className="btn" onClick={handleLogout}>Sign out</button>
      </div>
          ) : (
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
    <button
      className="btn"
      onClick={async () => {
        try {
          const result = await window.googleSignIn();
              const name = result.user.displayName || result.user.email;
              handleLogin(name);
        } catch (e) {
          alert("Google sign-in cancelled");
        }
      }}
    >
      Sign in with Google
    </button>

    <button className="btn" onClick={()=>setShowLogin(true)}>
      Sign in (name)
    </button>
  </div>
)}
    <button
      className="btn"
      onClick={clearAllLocal}
      style={{ marginLeft: 8 }}
    >
      Clear All
    </button>

          </div>
        </div>

        <div className="container">
          <div>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
              <div style={{fontSize:14, color:'var(--muted)'}}>Characters</div>
              <div style={{fontSize:12, color:'var(--muted)'}}>Click stars to vote (saves to your name)</div>
            </div>

            <div className="grid">
              { visibleChars.map(c => (
                <CharacterCard key={c.img} char={c} user={user} votes={votes} onVote={setVoteForCurrent} />
              )) }
            </div>
          </div>

          <aside>
            <div className="panel">
              <h3>Leaderboard — Most liked</h3>
              <div style={{height:8}}/>
              { leaderboard.map(item => (
                <div key={item.img} className="leaderboard-row">
                  <div>
                    <div style={{fontWeight:700}}>{item.name}</div>
                    <div className="small">{item.actor}</div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontWeight:800}}>{item.votes} votes</div>
                    <div className="small">Avg {item.avg}/5</div>
                  </div>
                </div>
              )) }
              <div style={{height:8}}/>
              <button className="btn" onClick={()=>{ const csv = exportCSV(votes); downloadText(csv,'stranger_leaderboard.csv'); }}>Export CSV</button>
              <div style={{height:10}}/>
              <div style={{fontSize:13, color:'var(--muted)'}}>Signed-in fans see and edit their own votes. This demo stores data locally in this browser. For cloud sync across devices see Firebase instructions below.</div>
            </div>

            <div style={{height:12}}/>

            <div className="panel" style={{marginTop:12}}>
              <h3>Your account</h3>
              { user ? (
                <div>
                  <div style={{marginBottom:8}}>Name: <strong>{user}</strong></div>
                  <div style={{marginBottom:8}}>Your votes: <strong>{ Object.keys(votes[user]||{}).length }</strong></div>
                  <button className="btn" onClick={()=>{
                    // show user's votes in an alert
                    const myv = votes[user] || {};
                    const lines = Object.entries(myv).map(([img,v]) => {
                      const ch = CHAR_FILES.find(cc=>cc.img===img);
                      return `${ch ? ch.name : img}: ${v.stars} ★ (${v.label})`;
                    });
                    alert(lines.length ? lines.join('\\n') : 'You have not voted yet.');
                  }}>View my votes</button>
                </div>
              ) : (
                <div>
                  <div style={{marginBottom:8}}>No user signed in.</div>
                  <button className="btn" onClick={()=>setShowLogin(true)}>Sign in</button>
                </div>
              )}
            </div>

            <div style={{height:12}}/>
            <div className="panel" style={{marginTop:12}}>
              <h3>Tips</h3>
              <ul style={{color:'var(--muted)', paddingLeft:14}}>
                <li>give stars according to your love</li>
                <li>send me SS of your leaderboard.</li>
                <li>for any help feel free to DM me.</li>
              </ul>
            </div>
          </aside>
        </div>

        <footer style={{marginTop:18}}>
          <div style={{color:'var(--muted)'}}>Built for fun — this stores votes locally by username in your browser.</div>
        </footer>

        { showLogin && <LoginModal onClose={()=>setShowLogin(false)} onLogin={handleLogin} existingUsers={Object.keys(users)} /> }
      </div>
    );
  }

  /* CharacterCard component */
  function CharacterCard({ char, user, votes, onVote }){
    // show user-specific stars if user voted
    const userVotes = user ? (votes[user] || {}) : {};
    const myVote = userVotes[char.img];
    const displayStars = myVote ? myVote.stars : ( Math.round(((Object.values(votes).reduce((acc,uv)=> { if(uv[char.img]) acc.push(uv[char.img].stars); return acc }, []).reduce((s,x)=>s+x,0) / Math.max(1,Object.values(votes).reduce((c,uv)=> c + (uv[char.img] ? 1 : 0), 0))) ) || 0) );

    // compute overall label from votes mode if available
    const labels = [];
    Object.values(votes).forEach(uv => { if(uv[char.img]) labels.push(uv[char.img].label); });
    const overallLabel = labels.length ? computeMode(labels) : '—';

    return (
      <div className="card" role="article" aria-label={char.name}>
        <div className="photo">
          <img src={char.img} alt={char.name} onError={(e)=>{ e.target.style.display='none'; }} />
          {/* if image missing, CSS fallback shows background, but the app also works */}
        </div>

        <div className="meta">
          <div>
            <div className="who">{char.name}</div>
            <div className="by">{char.actor}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div className={'tag ' + (overallLabel ? overallLabel.toLowerCase().split(' ')[0] : 'good')}>{ overallLabel }</div>
          </div>
        </div>

        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <div className="stars" aria-label={`Rating for ${char.name}`}>
            { [1,2,3,4,5].map(n => (
              <svg key={n} className={'star ' + (n<= (myVote ? myVote.stars : displayStars) ? '' : 'off')} viewBox="0 0 24 24" width="22" height="22" onClick={() => onVote(char.img, n)} dangerouslySetInnerHTML={{__html: `<defs><linearGradient id="g${char.img.replace(/[^a-z0-9]/gi,'')}${n}" x1="0" x2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#ff7b00"/></linearGradient></defs><path fill="${ n <= (myVote ? myVote.stars : displayStars) ? 'url(#g'+char.img.replace(/[^a-z0-9]/gi,'')+n+')' : 'none' }" stroke="${ n <= (myVote ? myVote.stars : displayStars) ? 'none' : 'white' }" d="M12 .587l3.668 7.431L23.6 9.75l-5.6 5.459L19.336 24 12 20.202 4.664 24l1.336-8.791L.4 9.75l7.932-1.732z"/>`}} />
            )) }
          </div>

          <div style={{textAlign:'right', fontSize:13, color:'var(--muted)'}}>
            <div>{ myVote ? `${myVote.stars} / 5 (You)` : (displayStars ? `${displayStars} / 5 (avg)` : '— / 5') }</div>
          </div>
        </div>

        <div style={{display:'flex', justifyContent:'flex-end', marginTop:6}}>
          { user ? (
            <div style={{fontSize:12, color:'var(--muted)'}}>Voted as <strong>{user}</strong></div>
          ) : (
            <div style={{fontSize:12, color:'var(--muted)'}}>Sign in to save your vote</div>
          ) }
        </div>
      </div>
    );
  }

  function computeMode(arr){
    const map = {};
    arr.forEach(a => map[a] = (map[a]||0) + 1);
    let best = null, bestCount = -1;
    Object.entries(map).forEach(([k,v]) => { if(v>bestCount){ best = k; bestCount=v; }});
    return best;
  }

  /* Login modal */
  function LoginModal({ onClose, onLogin, existingUsers }){
    const [name, setName] = useState('');
    const [fav, setFav] = useState('');

    useEffect(()=> {
      // preselect first character as favourite suggestion
      setFav(CHAR_FILES[0].name);
    }, []);

    return (
      <div className="modal-backdrop" onClick={onClose}>
        <div className="modal" onClick={e=>e.stopPropagation()}>
          <h3 style={{marginTop:0}}>Sign in (simple name)</h3>
          <div style={{marginTop:8}}>
            <label style={{fontSize:13}}>Your display name</label>
            <input className="input" placeholder="e.g. Kittu" value={name} onChange={e=>setName(e.target.value)} style={{marginTop:8}}/>
          </div>

          <div style={{marginTop:12}}>
            <label style={{fontSize:13}}>Your favourite character (optional)</label>
            <select className="input" value={fav} onChange={e=>setFav(e.target.value)} style={{marginTop:8}}>
              { CHAR_FILES.map(c => <option key={c.img} value={c.name}>{c.name}</option>) }
            </select>
          </div>

          <div style={{display:'flex', gap:8, justifyContent:'flex-end', marginTop:14}}>
            <button className="btn" onClick={()=>{
              onLogin(name);
              // If they selected fav, set a default 5-star vote for that fav for the new user
              if(fav && name){
                const current = loadJSON(VOTES_KEY, {});
                current[name] = current[name] || {};
                // find character by name
                const ch = CHAR_FILES.find(x => x.name === fav);
                if(ch) { current[name][ch.img] = { stars:5, label: starsToLabel(5), ts: Date.now() }; saveJSON(VOTES_KEY, current); }
              }
            }}>Submit</button>
            <button className="btn" onClick={onClose}>Close</button>
          </div>

          <div style={{marginTop:10, color:'var(--muted)', fontSize:13}}>
            Tip: This site stores your name and votes locally in this browser. To sync across devices, configure a cloud backend (Firebase).
          </div>
        </div>
      </div>
    );
  }

  /* Utility: export CSV and download helper */
  function exportCSV(votesObj){
    // produce CSV of user,votedCharacter,stars,label
    const rows = [['user','character','stars','label','timestamp']];
    Object.entries(votesObj).forEach(([user, uv]) => {
      Object.entries(uv).forEach(([img, v]) => {
        const ch = CHAR_FILES.find(c=>c.img===img);
        rows.push([user, ch ? ch.name : img, v.stars, v.label, v.ts || '']);
      });
    });
    return rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\\n');
  }
  function downloadText(text, filename){
    const blob = new Blob([text], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  // render
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
