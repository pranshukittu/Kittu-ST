<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Welcome to Hawkins - Created by Kittu</title>

  <!-- React (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>

  <!-- Firebase (compat SDKs for single-file use) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root{
      --bg:#050406; --card:#0f1114; --accent:#ff2d44; --muted:#9aa0a6; --text:#eaf4ff;
      --good:#ffd86b; --perfect:#9b59b6; --love:#29b06f; --hate:#e74c3c; --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    html,body,#root{height:100%}
    body{
  margin:0;
  font-family: Inter, Arial, sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  padding:18px;

  /* Stranger Things background */
  background:
    linear-gradient(
      rgba(5,4,6,0.85),
      rgba(5,4,6,0.95)
    ),
    url("stbg.jpg");

  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

    /* header */
    .topbar{ display:flex; align-items:center; gap:16px; margin-bottom:18px; }
    .logo-badge{ background:linear-gradient(90deg,var(--accent),#ff7b9a); color:white; padding:8px 12px; border-radius:8px; font-weight:800; font-family: "Courier New", monospace; letter-spacing:1px; }
    h1.title{ margin:0; font-size:20px; font-weight:800; position:relative; display:inline-block; padding-bottom:6px; }
    h1.title:after{ content:""; position:absolute; left:0; right:0; bottom:-6px; height:6px; background: linear-gradient(90deg,var(--accent),#ff7b9a); filter: blur(8px); opacity:0.6; border-radius:6px; }
    .sub { font-size:13px; color:var(--muted); margin-left:8px; animation: pulse 2.6s infinite; }
    @keyframes pulse{ 0%{opacity:1}50%{opacity:.55}100%{opacity:1} }

    .toolbar{ margin-left:auto; display:flex; gap:8px; align-items:center; }
    .btn{ background:var(--glass); border:1px solid rgba(255,255,255,0.04); padding:8px 10px; border-radius:8px; color:var(--text); cursor:pointer; font-weight:600; }

    .container{ display:grid; grid-template-columns: 1fr 360px; gap:20px; align-items:start; }
    .grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:14px; }

    .card{ background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent); border-radius:12px; padding:12px; box-shadow: 0 14px 40px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.03); display:flex; flex-direction:column; gap:10px; min-height:340px; }
    .photo{ height:260px; border-radius:8px; overflow:hidden; background:linear-gradient(90deg, rgba(255,45,68,0.06), transparent); display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; position:relative; }
    .photo img{ width:100%; height:100%; object-fit:cover; object-position:50% 35%; display:block; cursor:zoom-in; transition: transform .22s ease; }
    .photo img:hover{ transform:scale(1.03) }

    .meta{ display:flex; justify-content:space-between; align-items:flex-start; }
    .who{ font-weight:800; font-size:15px; } .by{ font-size:12px; color:var(--muted); }

    .tag{ padding:6px 10px; border-radius:999px; font-weight:700; font-size:12px; color:var(--text); background:var(--good); }
    .tag.perfect{ background:var(--perfect); color:white; } .tag.love{ background:var(--love); color:white; } .tag.good{ background:var(--good); color:#222; } .tag.hate{ background:var(--hate); color:white; }

    .stars{ display:flex; gap:6px; align-items:center; }
    .star{ width:22px; height:22px; cursor:pointer; opacity:0.95; transition:transform .12s; } .star.off{ filter: grayscale(80%); opacity:0.45; } .star:hover{ transform:scale(1.08) }

    .panel{ background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:12px; padding:12px; border:1px solid rgba(255,255,255,0.03); }
    .panel h3{ margin:0 0 8px 0; font-size:15px }
    .leaderboard-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,0.03) }
    .small{ font-size:13px; color:var(--muted) }

    /* popup for intro */
    .popup-backdrop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9999; background: radial-gradient(ellipse at 50% 10%, rgba(20,0,0,0.65), rgba(0,0,0,0.85) 40%); backdrop-filter: blur(2px); animation: popupFade .45s ease; }
    @keyframes popupFade { from { opacity: 0; } to { opacity: 1; } }
    .popup-card { width: min(92vw, 980px); max-height: 88vh; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 120px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.04); background: linear-gradient(180deg,#0b0b0d,#070709); position: relative; display: grid; grid-template-columns: 1fr 420px; }
    .popup-left{ padding:28px; display:flex; flex-direction:column; justify-content:center; gap:12px; position:relative; overflow:hidden; }
    .popup-roots{ position:absolute; left:-10%; top:-20%; width:140%; height:140%; opacity:0.16; pointer-events:none; filter: blur(0.6px) saturate(1.1); }
    .popup-title{ font-family: "Courier New", monospace; font-weight:900; font-size: clamp(26px, 4.2vw, 44px); color:#ffdddd; letter-spacing:2px; text-shadow:0 6px 24px rgba(255,45,68,0.12); animation: titleFloat 3.8s ease-in-out infinite; }
    @keyframes titleFloat { 0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)} }
    .popup-poster{ display:flex; align-items:center; justify-content:center; padding:18px; } .popup-poster img{ width:100%; height:100%; max-height:72vh; object-fit: contain; border-radius:8px; box-shadow: 0 18px 60px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.03); }
    .popup-close{ position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.04); color:var(--text); padding:8px 10px; border-radius:8px; cursor:pointer; z-index:20; font-weight:700; }
    @media (max-width:820px){ .popup-card{ grid-template-columns:1fr } }

    footer{ margin-top:16px; color:var(--muted); font-size:13px; }
    @media (max-width:980px){ .container{ grid-template-columns: 1fr; } }

    @media (max-width:768px){
  body{
    background-attachment: scroll;
    background-position: center;
  }
}

  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Intro popup HTML (after root) -->
  <div id="st-popup" class="popup-backdrop" role="dialog" aria-modal="true" aria-labelledby="st-title" style="display:none;">
    <div class="popup-card" role="document">
      <button class="popup-close" aria-label="Close intro" id="st-popup-close">✕</button>
      <div class="popup-left">
        <svg class="popup-roots" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs><linearGradient id="gR" x1="0" x2="1"><stop offset="0" stop-color="#3b0b0b"/><stop offset="1" stop-color="#6b0b12"/></linearGradient></defs>
          <g fill="url(#gR)" transform="translate(0,80)"><path d="M1200 200c-120 60-240 160-360 220-60 30-120 50-180 60-40 7-80 10-120 10s-80-3-120-10c-60-10-120-30-180-60C360 360 240 260 120 200 80 180 40 160 0 160v320h1200V200z" opacity="0.9"/><path d="M0 220c60 40 120 70 180 96 120 54 240 86 360 92 160 8 320-12 480-44 60-14 120-32 180-60 60-28 120-66 180-114V0H0v220z" opacity="0.6"/></g>
        </svg>
        <h2 id="st-title" class="popup-title">STRANGER THINGS</h2>
        <div class="popup-sub" style="color:#fff;opacity:.9">Step into Hawkins. Vote for your favourite characters and see who the town loves most.</div>
        <div class="popup-footer" style="margin-top:10px;color:var(--muted);font-size:13px"><small>Tip: Click poster on the right to view full image. Close to enter the site.</small></div>
      </div>
      <div class="popup-poster">
        <img id="poster.jpg" src="poster.jpg" alt="Stranger Things — poster of characters" onerror="this.style.opacity='.06'; this.nextElementSibling && (this.nextElementSibling.style.display='block')">
        <div style="display:none; color:var(--muted); text-align:center; width:100%;">Poster image missing — add <code>images/poster.jpg</code> to show the poster</div>
      </div>
    </div>
  </div>

  <!-- Firebase init & helpers -->
  <script>
    /*************************************************************************
     * IMPORTANT: Replace the FIREBASE_CONFIG object below with your project's
     * config from Firebase console (Project Settings → Your apps → SDK config)
     *************************************************************************/
    const FIREBASE_CONFIG = {
      // <-- REPLACE THESE VALUES with your Firebase web app config
      apiKey: "AIzaSyDAVeSuM5nA5xdJ0TlZUHmc7SB8l2AUSbA",
  authDomain: "st-kittu.firebaseapp.com",
  projectId: "st-kittu",
  storageBucket: "st-kittu.firebasestorage.app",
  messagingSenderId: "88226710538",
  appId: "1:88226710538:web:f2bda4fe86b3568d1a8bf3",
  measurementId: "G-585W045D6X"
    };

    // initialize Firebase
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      var firebaseAuth = firebase.auth();
      var firebaseDb = firebase.firestore();
    } catch(e){
      console.warn('Firebase init error (did you paste config?):', e);
      firebaseAuth = null; firebaseDb = null;
    }

    // Save a single user's vote to Firestore (doc per user+char)
    async function saveVoteToFirestore(imgPath, uid, stars, label){
      if(!firebaseDb) return false;
      try {
        const slug = imgPath.replace(/[^a-z0-9]/gi, '_');
        const docId = `${slug}_${uid}`;
        await firebaseDb.collection('votes').doc(docId).set({
          img: imgPath, uid, stars, label, ts: firebase.firestore.FieldValue.serverTimestamp()
        });
        return true;
      } catch (err) {
        console.error('saveVoteToFirestore error', err);
        return false;
      }
    }

    // Subscribe realtime to votes collection and aggregate
    function subscribeVotesRealtime(onUpdate){
      if(!firebaseDb) return () => {};
      try {
        return firebaseDb.collection('votes').onSnapshot(snapshot => {
          const byImg = {};
          snapshot.forEach(doc => {
            const d = doc.data();
            const img = d.img;
            byImg[img] = byImg[img] || { votes: [] };
            byImg[img].votes.push({ uid: d.uid, stars: d.stars, label: d.label });
          });
          Object.keys(byImg).forEach(img => {
            const v = byImg[img].votes;
            const count = v.length;
            const avg = count ? (v.reduce((s,x)=>s+(x.stars||0),0)/count) : 0;
            const mode = (() => { const map = {}; v.forEach(x=>map[x.label]=(map[x.label]||0)+1); let best=null,bc=-1; Object.entries(map).forEach(([k,c]) => { if(c>bc){best=k;bc=c;} }); return best; })();
            byImg[img].count = count; byImg[img].avg = +avg.toFixed(2); byImg[img].modeLabel = mode || '—';
          });
          onUpdate(byImg);
        }, err => { console.error('subscribeVotesRealtime error', err); onUpdate({}); });
      } catch(e){ console.error('subscribeVotesRealtime init error', e); return () => {}; }
    }

    // Sign-in with Google popup
    async function signInWithGooglePopup(){
      if(!firebaseAuth) throw new Error('Firebase not initialized');
      const provider = new firebase.auth.GoogleAuthProvider();
      return firebaseAuth.signInWithPopup(provider);
    }
    function signOutFirebase(){ if(firebaseAuth) return firebaseAuth.signOut(); return Promise.resolve(); }

    // click-to-open full image handler
    document.addEventListener('click', function(e){
      const el = e.target;
      if(el.tagName === 'IMG' && el.closest && el.closest('.photo')){
        const src = el.getAttribute('src');
        if(src) window.open(src, '_blank');
      }
    });

    // intro popup handlers
    (function(){
      const popup = document.getElementById('st-popup');
      const closeBtn = document.getElementById('st-popup-close');
      const poster = document.getElementById('st-poster-img');
      function showPopup(){ popup.style.display = 'flex'; closeBtn.focus(); }
      function hidePopup(){ popup.style.display = 'none'; }
      closeBtn.addEventListener('click', hidePopup);
      popup.addEventListener('click', function(e){ if(e.target === popup) hidePopup(); });
      document.addEventListener('keydown', function(e){ if(e.key === 'Escape') hidePopup(); });
      poster && poster.addEventListener('click', function(){ const src = poster.getAttribute('src'); if(src) window.open(src, '_blank'); });
      setTimeout(showPopup, 450);
    })();
  </script>

  <!-- App code (React) -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    /* --- set your image folder and characters here --- */
    const IMAGE_FOLDER = 'images/'; // put your character images inside /images/
    const CHAR_FILES = [
      { name: "Joyce Byers", actor: "Winona Ryder", img:"joyce.jpg" },
      { name: "Jim Hopper", actor: "David Harbour", img:"hopper.jpg" },
      { name: "Mike Wheeler", actor: "Finn Wolfhard", img:"mike.jpg" },
      { name: "Eleven / Jane Hopper", actor: "Millie Bobby Brown", img:"el.jpg" },
      { name: "Dustin Henderson", actor: "Gaten Matarazzo", img:"dustin.jpg" },
      { name: "Lucas Sinclair", actor: "Caleb McLaughlin", img:"lucas.jpg" },
      { name: "Nancy Wheeler", actor: "Natalia Dyer", img:"nancy.jpg" },
      { name: "Jonathan Byers", actor: "Charlie Heaton", img:"jonathan.jpg" },
      { name: "Karen Wheeler", actor: "Cara Buono", img:"karen.jpg" },
      { name: "Will Byers", actor: "Noah Schnapp", img:"will.jpg" },
      { name: "Steve Harrington", actor: "Joe Keery", img:"steve.jpg" },
      { name: "Max Mayfield", actor: "Sadie Sink", img:"max.jpg" },
      { name: "Erica Sinclair", actor: "Priah Ferguson", img:"erica.jpg" },
      { name: "Robin Buckley", actor: "Maya Hawke", img:"robin.jpg" },
      { name: "Murray Bauman", actor: "Brett Gelman", img:"murray.jpg" },
      { name: "Vecna / One / Henry Creel", actor: "Jamie Campbell Bower", img:"vecnahenry.jpg" },
      { name: "Dr. Kay", actor: "Linda Hamilton", img:"drkay.jpg" },
      { name: "Derek Turnbow", actor: "Jake Connelly", img:"derek.jpg" },
      { name: "Tina Turnbow", actor: "caroline-elle-abrahim", img:"tina.jpg" },
      { name: "Holly Weeler", actor: "Nell Fisher", img:"holly.jpg" }
    ];

    // localStorage keys
    const USERS_KEY = 'sfans_users_v1';
    const VOTES_KEY = 'sfans_votes_v1';
    const CUR_USER_KEY = 'sfans_current_user_v1';

    function starsToLabel(n){
      if(n >= 5) return 'Perfect';
      if(n === 4) return 'Love them';
      if(n === 3) return 'Good';
      return 'hate them';
    }

    function loadJSON(key, fallback){
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch(e){ return fallback; }
    }
    function saveJSON(key, obj){ localStorage.setItem(key, JSON.stringify(obj)); }

    function App(){
      // local user (simple name), users and local votes
      const [user, setUser] = useState(() => loadJSON(CUR_USER_KEY, null));
      const [users, setUsers] = useState(() => loadJSON(USERS_KEY, {}));
      const [votes, setVotes] = useState(() => loadJSON(VOTES_KEY, {}));
      const [showLogin, setShowLogin] = useState(!user);
      const [filterQuery, setFilterQuery] = useState('');

      // firebase state
      const [firebaseUser, setFirebaseUser] = useState(null);
      const [cloudAgg, setCloudAgg] = useState({});

      useEffect(()=> saveJSON(USERS_KEY, users), [users]);
      useEffect(()=> saveJSON(VOTES_KEY, votes), [votes]);
      useEffect(()=> saveJSON(CUR_USER_KEY, user), [user]);

      // subscribe to auth & cloud votes
      useEffect(() => {
        let authUnsub = null;
        if (window.firebase && typeof window.firebase.auth === 'function' && typeof firebase.auth().onAuthStateChanged === 'function') {
          authUnsub = firebase.auth().onAuthStateChanged(u => {
            setFirebaseUser(u ? { uid: u.uid, name: u.displayName || u.email } : null);
          });
        }
        let votesUnsub = null;
        if (typeof subscribeVotesRealtime === 'function') {
          votesUnsub = subscribeVotesRealtime(agg => setCloudAgg(agg || {}));
        }
        return () => { if(authUnsub) authUnsub(); if(votesUnsub) votesUnsub(); };
      }, []);

      // compute leaderboard, prefer cloudAgg if available
      function computeLeaderboard(){
        if (Object.keys(cloudAgg || {}).length) {
          return CHAR_FILES.map(c => {
            const a = cloudAgg[c.img] || { votes: [], count:0, avg:0 };
            const count = a.count || (a.votes ? a.votes.length : 0);
            const avg = a.avg || 0;
            return { img:c.img, name:c.name, actor:c.actor, votes: count, avg };
          }).sort((a,b) => b.votes - a.votes);
        }
        // fallback to local aggregation
        const agg = {};
        Object.entries(votes).forEach(([uname, userVotes]) => {
          Object.entries(userVotes).forEach(([img, v]) => {
            agg[img] = agg[img] || { count:0, starsTotal:0 };
            agg[img].count += 1;
            agg[img].starsTotal += (v.stars || 0);
          });
        });
        return CHAR_FILES.map(c => {
          const a = agg[c.img] || { count:0, starsTotal:0 };
          return { img:c.img, name:c.name, actor:c.actor, votes:a.count, avg: a.count ? +(a.starsTotal / a.count).toFixed(2) : 0 };
        }).sort((a,b) => b.votes - a.votes);
      }

      function handleLogin(name){
        const trimmed = (name || '').trim();
        if(!trimmed){ alert('Enter a name'); return; }
        setUsers(prev => ({ ...prev, [trimmed]: { name: trimmed, created: Date.now() } }));
        setUser(trimmed);
        setShowLogin(false);
      }
      function handleLogout(){ setUser(null); setShowLogin(true); }

      // New: set vote and prefer firestore for signed-in firebase user
      async function setVoteForCurrent(imgPath, stars){
        const label = starsToLabel(stars);
        if (firebaseUser && firebaseUser.uid) {
          const uid = firebaseUser.uid;
          const ok = await saveVoteToFirestore(imgPath, uid, stars, label);
          if(!ok){
            // fallback to local
            setVotes(prev => {
              const copy = { ...prev };
              const userKey = firebaseUser.name || uid;
              copy[userKey] = copy[userKey] || {};
              copy[userKey][imgPath] = { stars, label, ts: Date.now() };
              return copy;
            });
          } else {
            setVotes(prev => {
              const copy = { ...prev };
              const userKey = firebaseUser.name || uid;
              copy[userKey] = copy[userKey] || {};
              copy[userKey][imgPath] = { stars, label, ts: Date.now() };
              return copy;
            });
          }
        } else {
          alert('Sign in (Google) to store your vote across devices — otherwise it will be saved only locally.');
          setVotes(prev => {
            const copy = { ...prev };
            const localUser = user || 'guest';
            copy[localUser] = copy[localUser] || {};
            copy[localUser][imgPath] = { stars, label, ts: Date.now() };
            return copy;
          });
        }
      }

      function clearAllLocal(){
        if(!confirm('Clear ALL saved local users and votes in this browser?')) return;
        setUsers({}); setVotes({}); setUser(null);
        localStorage.removeItem(USERS_KEY); localStorage.removeItem(VOTES_KEY); localStorage.removeItem(CUR_USER_KEY);
        setShowLogin(true);
      }

      const leaderboard = computeLeaderboard();
      const visibleChars = CHAR_FILES.filter(c => {
        if(!filterQuery) return true;
        const q = filterQuery.toLowerCase();
        return c.name.toLowerCase().includes(q) || c.actor.toLowerCase().includes(q);
      });

      return (
        <div>
          <div className="topbar">
            <div className="logo-badge">HAWKINS</div>
            <div>
              <h1 className="title">Welcome to Hawkins - Created by Kittu</h1>
              <div className="sub">A spooky place for fans — vote your favourites</div>
            </div>

            <div className="toolbar">
              <input className="input" placeholder="Search characters..." value={filterQuery} onChange={e=>setFilterQuery(e.target.value)} style={{width:220, marginRight:6}} />
              { firebaseUser ? (
                <div style={{display:'flex', gap:8, alignItems:'center'}}>
                  <div style={{fontSize:13, color:'var(--muted)'}}>Signed in (Google) as <strong style={{color:'var(--text)'}}>{firebaseUser.name}</strong></div>
                  <button className="btn" onClick={()=>{ firebaseAuth && firebaseAuth.signOut(); }}>Sign out</button>
                </div>
              ) : (
                <div style={{display:'flex', gap:8, alignItems:'center'}}>
                  <button className="btn" onClick={async ()=> {
                    try{ await signInWithGooglePopup(); } catch(e){ alert('Sign-in canceled or error'); console.error(e); }
                  }}>Sign in (Google)</button>
                  <button className="btn" onClick={()=>setShowLogin(true)}>Sign in (name)</button>
                </div>
              )}
              <button className="btn" title="Clear all local data" onClick={clearAllLocal} style={{marginLeft:8}}>Clear All</button>
            </div>
          </div>

          <div className="container">
            <div>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
                <div style={{fontSize:14, color:'var(--muted)'}}>Characters</div>
                <div style={{fontSize:12, color:'var(--muted)'}}>Click stars to vote (saves to your account if signed in)</div>
              </div>

              <div className="grid">
                { visibleChars.map(c => <CharacterCard key={c.img} char={c} user={user} votes={votes} cloudAgg={cloudAgg} onVote={setVoteForCurrent} />) }
              </div>
            </div>

            <aside>
              <div className="panel">
  <h3>Character Reactions</h3>
  <div style={{height:8}}/>

  {CHAR_FILES.map(c => {
    const cloud = cloudAgg[c.img];
    let label = '—';
    let count = 0;

    if (cloud && cloud.modeLabel) {
      label = cloud.modeLabel;
      count = cloud.count || 0;
    } else {
      // fallback to local votes
      const labels = [];
      Object.values(votes).forEach(uv => {
        if (uv[c.img]) labels.push(uv[c.img].label);
      });
      if (labels.length) {
        label = computeMode(labels);
        count = labels.length;
      }
    }

    return (
      <div key={c.img} className="leaderboard-row">
        <div>
          <div style={{fontWeight:700}}>{c.name}</div>
          <div className="small">{c.actor}</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div className={'tag ' + label.toLowerCase().split(' ')[0]}>
            {label}
          </div>
          <div className="small">{count} votes</div>
        </div>
      </div>
    );
  })}

  <div style={{height:8}}/>
  <div className="small">
    Shows the most common reaction fans gave to each character.
  </div>
</div>


              <div style={{height:12}}/>
              <div className="panel" style={{marginTop:12}}>
                <h3>Your account</h3>
                { user ? (
                  <div>
                    <div style={{marginBottom:8}}>Name: <strong>{user}</strong></div>
                    <div style={{marginBottom:8}}>Your votes: <strong>{ Object.keys(votes[user]||{}).length }</strong></div>
                    <button className="btn" onClick={()=>{
                      const myv = votes[user] || {};
                      const lines = Object.entries(myv).map(([img,v]) => { const ch = CHAR_FILES.find(cc=>cc.img===img); return `${ch ? ch.name : img}: ${v.stars} ★ (${v.label})`; });
                      alert(lines.length ? lines.join('\n') : 'You have not voted yet.');
                    }}>View my votes</button>
                  </div>
                ) : (
                  <div>
                    <div style={{marginBottom:8}}>No user signed in.</div>
                    <button className="btn" onClick={()=>setShowLogin(true)}>Sign in (name)</button>
                  </div>
                )}
              </div>

              <div style={{height:12}}/>
              <div className="panel" style={{marginTop:12}}>
                <h3>Tips</h3>
                <ul style={{color:'var(--muted)', paddingLeft:14}}>
                  <li>Place your images in folder <code>/images/</code> next to this file with filenames listed in code.</li>
                  <li>Use square or portrait images 400×400+ for best results.</li>
                  <li>To sync across devices, sign in with Google (free) — enable it in Firebase console and add your GitHub domain to Authorized domains.</li>
                </ul>
              </div>
            </aside>
          </div>

          <footer style={{marginTop:18}}>
            <div style={{color:'var(--muted)'}}>Built for fun — cloud saves require Firebase config.</div>
          </footer>

          { showLogin && <LoginModal onClose={()=>setShowLogin(false)} onLogin={handleLogin} existingUsers={Object.keys(users)} /> }
        </div>
      );
    }

    function CharacterCard({ char, user, votes, cloudAgg, onVote }){
      const userVotes = user ? (votes[user] || {}) : {};
      const myVote = userVotes[char.img];
      // displayStars: prefer user's vote; else use average from cloud or local
      let displayStars = myVote ? myVote.stars : 0;
      if(!displayStars){
        if (cloudAgg && cloudAgg[char.img] && cloudAgg[char.img].avg) displayStars = Math.round(cloudAgg[char.img].avg);
        else {
          // local avg
          const arr = Object.values(votes).reduce((acc,uv)=> { if(uv[char.img]) acc.push(uv[char.img].stars); return acc; }, []);
          if(arr.length) displayStars = Math.round(arr.reduce((s,x)=>s+x,0)/arr.length);
        }
      }
      const labels = [];
      Object.values(votes).forEach(uv => { if(uv[char.img]) labels.push(uv[char.img].label); });
      const overallLabel = (cloudAgg && cloudAgg[char.img] && cloudAgg[char.img].modeLabel) ? cloudAgg[char.img].modeLabel : (labels.length ? computeMode(labels) : '—');

      return (
        <div className="card" role="article" aria-label={char.name}>
          <div className="photo">
            <img src={char.img} alt={char.name} onError={(e)=>{ e.target.style.display='none'; }} />
          </div>

          <div className="meta">
            <div>
              <div className="who">{char.name}</div>
              <div className="by">{char.actor}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div className={'tag ' + (overallLabel ? overallLabel.toLowerCase().split(' ')[0] : 'good')}>{ overallLabel }</div>
            </div>
          </div>

          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div className="stars" aria-label={`Rating for ${char.name}`}>
              { [1,2,3,4,5].map(n => (
                <svg key={n} className={'star ' + (n<= (myVote ? myVote.stars : displayStars) ? '' : 'off')} viewBox="0 0 24 24" width="22" height="22" onClick={()=> onVote(char.img, n)} dangerouslySetInnerHTML={{__html: `<defs><linearGradient id="g${char.img.replace(/[^a-z0-9]/gi,'')}${n}" x1="0" x2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#ff7b00"/></linearGradient></defs><path fill="${ n <= (myVote ? myVote.stars : displayStars) ? 'url(#g'+char.img.replace(/[^a-z0-9]/gi,'')+n+')' : 'none' }" stroke="${ n <= (myVote ? myVote.stars : displayStars) ? 'none' : 'white' }" d="M12 .587l3.668 7.431L23.6 9.75l-5.6 5.459L19.336 24 12 20.202 4.664 24l1.336-8.791L.4 9.75l7.932-1.732z"/></svg>`}} />
              )) }
            </div>

            <div style={{textAlign:'right', fontSize:13, color:'var(--muted)'}}>
              <div>{ myVote ? `${myVote.stars} / 5 (You)` : (displayStars ? `${displayStars} / 5 (avg)` : '— / 5') }</div>
            </div>
          </div>

          <div style={{display:'flex', justifyContent:'flex-end', marginTop:6}}>
            { user ? <div style={{fontSize:12, color:'var(--muted)'}}>Signed in as <strong>{user}</strong></div> : <div style={{fontSize:12, color:'var(--muted)'}}>Sign in to save your vote</div> }
          </div>
        </div>
      );
    }

    function computeMode(arr){
      const map = {}; arr.forEach(a => map[a] = (map[a]||0)+1);
      let best=null, bc=-1; Object.entries(map).forEach(([k,v])=>{ if(v>bc){best=k;bc=v;} }); return best;
    }

    function LoginModal({ onClose, onLogin, existingUsers }){
      const [name, setName] = useState('');
      const [fav, setFav] = useState('');
      useEffect(()=> setFav(CHAR_FILES[0].name), []);
      return (
        <div className="modal-backdrop" style={{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',zIndex:999}} onClick={onClose}>
          <div className="panel" style={{width:420}} onClick={e=>e.stopPropagation()}>
            <h3 style={{marginTop:0}}>Sign in (simple name)</h3>
            <div style={{marginTop:8}}>
              <label style={{fontSize:13}}>Your display name</label>
              <input className="input" placeholder="e.g. Kittu" value={name} onChange={e=>setName(e.target.value)} style={{marginTop:8}}/>
            </div>
            <div style={{marginTop:12}}>
              <label style={{fontSize:13}}>Your favourite character (optional)</label>
              <select className="input" value={fav} onChange={e=>setFav(e.target.value)} style={{marginTop:8}}>
                { CHAR_FILES.map(c => <option key={c.img} value={c.name}>{c.name}</option>) }
              </select>
            </div>

            <div style={{display:'flex', gap:8, justifyContent:'flex-end', marginTop:14}}>
              <button className="btn" onClick={()=>{ onLogin(name); if(fav && name){ const current = loadJSON(VOTES_KEY, {}); current[name] = current[name] || {}; const ch = CHAR_FILES.find(x=>x.name===fav); if(ch) { current[name][ch.img] = { stars:5, label: starsToLabel(5), ts: Date.now() }; saveJSON(VOTES_KEY, current); } } }}>Submit</button>
              <button className="btn" onClick={onClose}>Close</button>
            </div>
            <div style={{marginTop:10, color:'var(--muted)', fontSize:13}}>Tip: This site stores your name and votes locally in this browser. To sync across devices, sign in with Google.</div>
          </div>
        </div>
      );
    }

    // CSV export helpers
    function exportCSV(votesObj){
      const rows = [['user','character','stars','label','timestamp']];
      Object.entries(votesObj).forEach(([user, uv]) => {
        Object.entries(uv).forEach(([img, v]) => {
          const ch = CHAR_FILES.find(c=>c.img===img);
          rows.push([user, ch ? ch.name : img, v.stars, v.label, v.ts || '']);
        });
      });
      return rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
    }
    function downloadText(text, filename){
      const blob = new Blob([text], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
